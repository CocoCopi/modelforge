name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MF_KEYSTORE_PATH: ${{ github.workspace }}/.modelforge.keystore
      MF_KEYSTORE_PASSWORD: ${{ secrets.MF_KEYSTORE_PASSWORD }}
      MF_KEY_PASSWORD: ${{ secrets.MF_KEY_PASSWORD }}
      MF_KEY_ALIAS: modelforge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode signing key
        env:
          MF_KEYSTORE_BASE64: ${{ secrets.MF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MF_KEYSTORE_BASE64" ]; then
            printf '%s' "$MF_KEYSTORE_BASE64" | base64 -d > "$MF_KEYSTORE_PATH"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          key: ndk-26.1.10909125-${{ runner.os }}

      - name: Cache CMake
        id: cmake-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/cmake/3.22.1
          key: cmake-3.22.1-${{ runner.os }}

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Native host tests
        run: |
          cmake -S app/src/main/cpp -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native -j"$(nproc)"
          ctest --test-dir build-native --output-on-failure

      - name: Unit tests
        run: ./gradlew testDebugUnitTest verifyPaparazziDebug --stacktrace --no-daemon

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            app/src/test/snapshots/**
            app/build/paparazzi/**
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: modelforge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Verify release signing
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose \
              app/build/outputs/apk/release/app-release.apk
          else
            echo "No signing key available; release APK is unsigned."
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: modelforge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: modelforge-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v4
        with:
          name: modelforge-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports
          path: |
            app/build/reports/tests/**
            build-native/**
          if-no-files-found: ignore
