name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# The workflow only needs to read the repository. Signing secrets are pulled
# in per job, never exposed to the whole workflow.
permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          key: ndk-26.1.10909125-${{ runner.os }}

      - name: Cache CMake
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/cmake/3.22.1
          key: cmake-3.22.1-${{ runner.os }}

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Native host tests
        run: |
          cmake -S app/src/main/cpp -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native -j"$(nproc)"
          ctest --test-dir build-native --output-on-failure

      - name: Unit tests
        run: ./gradlew testDebugUnitTest verifyPaparazziDebug --stacktrace --no-daemon

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            app/src/test/snapshots/**
            app/build/paparazzi/**
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: modelforge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports
          path: |
            app/build/reports/tests/**
            build-native/**
          if-no-files-found: ignore

  release:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    # Pull requests (including forks) have no access to the signing secret, so
    # the release job only runs for pushes and manual dispatches.
    if: github.event_name != 'pull_request'
    env:
      MF_KEYSTORE_PATH: ${{ github.workspace }}/.modelforge.keystore
      MF_KEYSTORE_PASSWORD: ${{ secrets.MF_KEYSTORE_PASSWORD }}
      MF_KEY_PASSWORD: ${{ secrets.MF_KEY_PASSWORD }}
      MF_KEY_ALIAS: modelforge
      MF_KEYSTORE_BASE64: ${{ secrets.MF_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode signing key
        run: |
          if [ -z "$MF_KEYSTORE_BASE64" ]; then
            echo "::error::MF_KEYSTORE_BASE64 is not configured. A release build must never be published unsigned."
            exit 1
          fi
          printf '%s' "$MF_KEYSTORE_BASE64" | base64 -d > "$MF_KEYSTORE_PATH"
          chmod 600 "$MF_KEYSTORE_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-release-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          key: ndk-26.1.10909125-${{ runner.os }}

      - name: Cache CMake
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/cmake/3.22.1
          key: cmake-3.22.1-${{ runner.os }}

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Verify release signing
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | head -20

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: modelforge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: modelforge-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v4
        with:
          name: modelforge-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-reports
          path: app/build/reports/**
          if-no-files-found: ignore

  emulator:
    name: Instrumented UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-emulator-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-emulator-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
